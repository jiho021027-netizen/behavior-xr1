[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-xr1"
version = "0.0.1"
description = "Lightweight adaptation scaffold for XR-1 and BEHAVIOR 2026"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
